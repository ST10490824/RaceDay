
name: RaceDay CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API dependencies
        run: dotnet restore ./RaceDay.API/RaceDay.API.csproj

      - name: Build API
        run: dotnet build ./RaceDay.API/RaceDay.API.csproj --no-restore

      - name: Restore Web dependencies
        run: dotnet restore ./RaceDay.Web/RaceDay.Web.csproj

      - name: Build Web
        run: dotnet build ./RaceDay.Web/RaceDay.Web.csproj --no-restore
